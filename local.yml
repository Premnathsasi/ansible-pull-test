---
- name: Install baseline packages via ansible-pull
  hosts: localhost
  connection: local
  become: true

  vars:
    packages_to_install:
      - apache2
      - openssh-server

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install packages
      apt:
        name: "{{ packages_to_install }}"
        state: present

    - name: Ensure services are running and enabled
      service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - apache2
        - ssh

    - name: Check apache2 version
      command: apache2 -v
      register: apache_version
      changed_when: false

    - name: Check sshd version
      command: sshd -V
      register: sshd_version
      changed_when: false
      # sshd -V exits 1 even on success (prints to stderr), so don't fail the play
      failed_when: false

    - name: Print versions
      debug:
        msg:
          - "{{ apache_version.stdout }}"
          - "{{ sshd_version.stderr }}"
